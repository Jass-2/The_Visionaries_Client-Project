
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Brothers In Arms</title>
  <link rel="stylesheet" href="../admin/admin-style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-logo">
      <a href="../index.html">
        <img src="../images/logo-main.svg" alt="Brothers in Arms Memorial">
      </a>
    </div>
    
    <div class="login-form-container">
      <h1>Admin Login</h1>
      
      <form class="login-form" action="dashboard.html">
        <div class="form-group">
          <label for="username">USERNAME</label>
          <input type="text" id="username" placeholder="Username" required>
        </div>
        
        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        
        <div class="form-actions">
          <a href="#" class="forgot-password">Forgot password?</a>
          <button type="submit" class="login-button" formaction="dashboard.html">Login</button>
        </div>
      </form>
      
      <div style="text-align: center; margin-top: 2rem;">
        <a href="../index.html" style="color: #999; font-size: 0.875rem; text-decoration: none;">Return to website</a>
      </div>
    </div>
  </div>
</body>
</html>
