
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letters | Brothers In Arms CMS</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../admin/admin-style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Content</h1>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="news.html">News</a></li>
          <li><a href="events.html">Events</a></li>
          <li class="active"><a href="letters.html">Letters</a></li>
          <li><a href="progress.html">Our Progress</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="user-actions">
        <a href="dashboard.html" class="dashboard-link">Dashboard</a>
        <a href="login.html" class="logout-link">Logout</a>
      </div>
      
      <header class="content-header">
        <h1>Letters</h1>
        <p class="api-info">API ID : HISTORY PAGE</p>
      </header>

      <section class="content-section">
        <h2>Lived content</h2>
      
        <div class="content-list">

        </div>
      
        <button id="add-content-btn" class="add-content-btn">Add content +</button>
      </section>
      
      <!-- Letter Form Section -->
      <section id="letters-form-section" class="form-section" style="display: none;">
        <h2 id="form-title">Letter</h2>
      
        <form class="content-form">
          <div class="form-group">
            <label for="flname">NAME</label>
            <input type="text" id="flname" placeholder="Full Name">
          </div>
      
          <div class="form-group">
            <label for="date">DATE</label>
            <input type="text" id="date" placeholder="MMM DD, YYYY">
          </div>
      
          <div class="form-group">
            <label for="message">MESSAGE</label>
            <textarea id="message" placeholder="Text" rows="12"></textarea>
          </div>
      
          <div class="form-actions">
            <button type="submit" class="save-btn">Save</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script>
    // Simple toggle to show/hide the form
    document.getElementById('add-content-btn').addEventListener('click', function() {
      document.getElementById('letters-form-section').style.display = 'block';
      document.getElementById('form-title').textContent = 'Add New Letter';
    });
    
    // For demo purposes - Edit buttons
    const editButtons = document.querySelectorAll('.edit-btn');
    editButtons.forEach(button => {
      button.addEventListener('click', function() {
        document.getElementById('letters-form-section').style.display = 'block';
        document.getElementById('form-title').textContent = 'Edit Letter';
      });
    });
  </script>
  <script src="../admin/letters-cms.js"></script>
  
</body>
</html>
